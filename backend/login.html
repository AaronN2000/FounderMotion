<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | FounderMotion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

<style id="social-icon-only">
.social-btn svg {
  width: 22px !important;
  height: 22px !important;
  display: block !important;
  flex: 0 0 auto !important;
}
.social-btn {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
</style>

</head>
<body>
  <header class="site-header"><a class="brand" href="index.html">FounderMotion</a><p class="header-note">Strategic decisions, connected.</p></header>
  <section class="auth-screen">
    <div class="auth-card">
      <p class="eyebrow">Secure workspace</p><h1>Welcome back</h1><p class="auth-lede">Sign in to access your saved strategic map.</p>
      <form id="authForm">
        <label>Username or email<input id="authIdentity" required autocomplete="username" placeholder="you@company.com" /></label>
        <label>Password<input id="authPassword" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters" /></label>
        <div class="auth-options"><button class="text-button" id="forgotPassword" type="button">Forgot password?</button></div>
        <button class="primary-button" type="submit">Log in <span>&rarr;</span></button>
      </form>
      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
      <div class="social-divider"><span>or continue with</span></div>
<div class="social-buttons">
  <button class="social-btn" data-social="Google" type="button" aria-label="Continue with Google">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.21z"/>
      <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.55 0-4.71-1.72-5.49-4.04H3.27v2.52A9.74 9.74 0 0 0 12 21.75z"/>
      <path fill="#FBBC05" d="M6.51 13.83A5.85 5.85 0 0 1 6.2 12c0-.64.11-1.26.31-1.83V7.65H3.27A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.02 4.35l3.24-2.52z"/>
      <path fill="#EA4335" d="M12 6.13c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.23 14.63 2.25 12 2.25a9.74 9.74 0 0 0-8.73 5.4l3.24 2.52C7.29 7.85 9.45 6.13 12 6.13z"/>
    </svg>
  </button>

  <button class="social-btn" data-social="Apple" type="button" aria-label="Continue with Apple">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M16.77 12.72c-.02-2.25 1.84-3.34 1.92-3.39a4.12 4.12 0 0 0-3.25-1.76c-1.37-.14-2.67.82-3.36.82-.7 0-1.78-.8-2.92-.78a4.31 4.31 0 0 0-3.63 2.22c-1.56 2.7-.4 6.68 1.1 8.86.74 1.07 1.62 2.27 2.78 2.23 1.12-.05 1.54-.72 2.9-.72 1.35 0 1.73.72 2.91.7 1.21-.02 1.97-1.08 2.68-2.15a8.82 8.82 0 0 0 1.22-2.5 3.87 3.87 0 0 1-2.35-3.53zM14.57 6.14a3.88 3.88 0 0 0 .89-2.78 3.96 3.96 0 0 0-2.56 1.33 3.7 3.7 0 0 0-.92 2.68 3.27 3.27 0 0 0 2.59-1.23z"/>
    </svg>
  </button>

  <button class="social-btn" data-social="Facebook" type="button" aria-label="Continue with Facebook">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#1877F2" d="M24 12a12 12 0 1 0-13.88 11.85v-8.39H7.08V12h3.04V9.41c0-3 1.79-4.66 4.53-4.66 1.31 0 2.68.23 2.68.23v2.95h-1.51c-1.49 0-1.95.93-1.95 1.87V12h3.32l-.53 3.46h-2.79v8.39A12 12 0 0 0 24 12z"/>
    </svg>
  </button>
</div>
    </div>
  </section>
  <section class="auth-screen" id="forgotScreen" hidden>
    <div class="auth-card">
      <p class="eyebrow">Account recovery</p>
      <h1>Reset password</h1>
      <p class="auth-lede">Enter your account details and create a new password.</p>

      <form id="forgotForm">
        <label>
          Username or email
          <input id="forgotIdentity" required autocomplete="username" />
        </label>

        <label>
          New password
          <input
            id="newPassword"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters"
          />
        </label>

        <label>
          Confirm new password
          <input
            id="confirmPassword"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Re-enter your new password"
          />
        </label>

        <button class="primary-button" type="submit">
          Reset password <span>&rarr;</span>
        </button>
      </form>

      <p class="auth-switch">
        <button class="text-button" id="backToLogin" type="button">
          &larr; Back to login
        </button>
      </p>
    </div>
  </section>
  <div id="toast" class="toast" role="status"></div><script src="auth.js"></script>
</body>
</html>
